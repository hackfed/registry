name: Check
on:
  # Run on pull requests to main branch
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Check
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Check Registry
        run: bunx @hackfed/toolbox@latest check-registry registry
